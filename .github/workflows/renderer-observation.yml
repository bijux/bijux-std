name: renderer-observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/renderer-observation.yml
      - tests/bijux-docs/execution/observe_history_renderer.py
      - tests/bijux-docs/generated/canon-docs-renderer.json
      - tests/bijux-docs/execution/recipes/canon-docs/requirements.lock
      - shared/bijux-docs/tooling/security/**
      - shared/bijux-docs/security/renderer_profiles.py
      - shared/bijux-docs/security/producer_capabilities.py
      - shared/bijux-docs/security/renderer-producer-admission.json
      - shared/bijux-docs/security/runtime/**

permissions:
  contents: read

jobs:
  history-renderer:
    name: ${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}std / history renderer observation
    if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.repository == 'bijux/bijux-std') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the existing Canon documentation Python line
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - name: Prepare pinned dependency installer
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.17'
          enable-cache: false
      - name: Install exact standalone documentation dependencies
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          UV_CACHE_DIR: ${{ github.workspace }}/artifacts/bijux-docs/history-renderer/cache
          UV_PYTHON_DOWNLOADS: never
          TMPDIR: ${{ github.workspace }}/artifacts/bijux-docs/history-renderer/process
        run: |
          set -euo pipefail
          mkdir -p artifacts/bijux-docs/history-renderer/{observation,process}
          python -m venv --without-pip artifacts/bijux-docs/history-renderer/python
          uv pip install --no-deps \
            --python artifacts/bijux-docs/history-renderer/python/bin/python \
            --requirement tests/bijux-docs/execution/recipes/canon-docs/requirements.lock \
            2>&1 | tee artifacts/bijux-docs/history-renderer/observation/install.log
          uv pip check --python artifacts/bijux-docs/history-renderer/python/bin/python \
            2>&1 | tee artifacts/bijux-docs/history-renderer/observation/dependency-check.log
      - name: Observe physical source and callbacks without profile selection
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          artifacts/bijux-docs/history-renderer/python/bin/python \
            tests/bijux-docs/execution/observe_history_renderer.py \
            --output artifacts/bijux-docs/history-renderer/observation/renderer.json \
            2>&1 | tee artifacts/bijux-docs/history-renderer/observation/capture.log
      - name: Retain exact candidate observation and failed diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-history-renderer-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/bijux-docs/history-renderer/observation
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publication-renderer:
    name: ${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}std / publication renderer / ${{ matrix.recipe }}
    if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh'))) && (github.repository == 'bijux/bijux-std' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: true
      matrix:
        recipe: [history, history-legacy, history-media]
    steps:
      - name: Checkout exact profile qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select reviewed publication interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - name: Select reviewed dependency installer
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.17'
          enable-cache: false
      - name: Qualify actual production installation and physical source profile
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PUBLICATION_RECIPE: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/docs/publication
          python shared/bijux-docs/tooling/security/install_publication_renderer.py \
            --recipe "$PUBLICATION_RECIPE" --python "$(command -v python)" \
            2>&1 | tee artifacts/docs/publication/qualification.log
      - name: Verify finite native media and source-owned callback boundaries
        if: ${{ matrix.recipe == 'history-media' }}
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          artifacts/docs/publication/python/bin/python -m unittest discover \
            -s tests/bijux-docs/publication -p 'test_*.py' -v \
            2>&1 | tee artifacts/docs/publication/capability-controls.log
      - name: Retain actual qualification and failed diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-renderer-${{ matrix.recipe }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/docs/publication/qualification.log
            artifacts/docs/publication/capability-controls.log
            artifacts/docs/publication/python-admission.json
            artifacts/docs/publication/python-wheels/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
